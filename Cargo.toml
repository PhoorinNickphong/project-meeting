[package]
name = "meeting-notes-core"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
getrandom = "=0.2.16"
hound = "3.5"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[build-dependencies]
embed-resource = "3.0"

[[bin]]
name = "meeting-notes"
path = "src/main.rs"
